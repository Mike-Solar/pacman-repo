name: build-packages

on:
  schedule:
    - cron: "0 21 * * 3"   # 每周四 05:00 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # archlinux 镜像无 git，checkout 会退化为 tarball 下载（无 .git），先装
      - name: Install git
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Build & publish
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/build.sh

      - name: Commit version state
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "mikesolar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update built versions"
            git push
          else
            echo "无版本变化"
          fi

      - name: Build log on failure
        if: failure()
        run: cat failed.txt 2>/dev/null || true
